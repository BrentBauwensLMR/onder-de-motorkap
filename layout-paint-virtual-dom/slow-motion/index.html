<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser in slow motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3ee; --panel: #ffffff; --sunk: #faf9f6;
    --ink: #1c1917; --ink-2: #44403c; --muted: #57534e; --faint: #78716c;
    --line: #e7e5e4; --line-2: #d6d3d1;
    --accent: #0f766e; --accent-2: #115e59; --accent-soft: #ccfbf1; --accent-tint: #f0fdfa;
    --warn: #c2410c; --warn-soft: #ffedd5; --warn-tint: #fff7ed;
    --new: #a16207; --new-soft: #fef3c7;
    --sans: Inter, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 14px;
    --shadow: 0 1px 2px rgba(28, 25, 23, .04), 0 4px 16px rgba(28, 25, 23, .05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  .app { max-width: 1440px; margin: 0 auto; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }

  /* Kop */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); position: relative; flex: none; }
  .logo::before, .logo::after { content: ""; position: absolute; border-radius: 3px; }
  .logo::before { inset: 8px 14px 14px 8px; background: var(--accent-soft); }
  .logo::after { inset: 14px 8px 8px 14px; background: #5eead4; opacity: .85; }
  .brand h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .frame-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; }
  .frame-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .frame-badge .dot.re { background: var(--warn); }

  /* Stepper */
  .stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 8px; }
  .step { position: relative; display: flex; align-items: center; gap: 10px; padding: 4px 12px; min-width: 0; }
  .step .num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--sans); color: var(--muted); background: var(--sunk); border: 1.5px solid var(--line-2); transition: all .25s; }
  .step .txt { display: flex; flex-direction: column; min-width: 0; }
  .step .nm { font-weight: 600; font-size: 14px; color: var(--muted); transition: color .25s; }
  .step .q { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.done .num { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent-2); }
  .step.done .nm { color: var(--ink-2); }
  .step.cur .num { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .step.cur .nm { color: var(--ink); }
  .step.cur .q { color: var(--accent); }
  .step.re .num { border-color: var(--warn); color: var(--warn); background: var(--warn-tint); }
  .step.re .nm { color: var(--ink-2); }
  .step.re.done .num { background: var(--warn-soft); border-color: var(--warn-soft); color: var(--warn); }
  .step.re.cur .num { background: var(--warn); border-color: var(--warn); color: #fff; box-shadow: 0 0 0 4px var(--warn-soft); }
  .step.re.cur .q { color: var(--warn); }
  .step.skip { opacity: .7; }
  .step.skip .num { border-style: dashed; background: transparent; }
  .step.skip .nm { text-decoration: line-through; text-decoration-color: var(--faint); }

  /* Raster van panelen */
  .grid { display: grid; grid-template-columns: 340px minmax(0, 1fr) 320px; gap: 14px; flex: 1; align-items: stretch; }
  @media (max-width: 1180px) { .grid { grid-template-columns: 300px minmax(0, 1fr); } .side { grid-column: 1 / -1; display: grid !important; grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } .side { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
  .label { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  /* Broncode */
  .src { font: 12px/1.75 var(--mono); white-space: pre; overflow-x: auto; background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; }
  .src div { padding: 0 10px 0 0; color: var(--faint); border-left: 3px solid transparent; transition: background .25s, color .25s, border-color .25s; }
  .src .ln { display: inline-block; width: 30px; text-align: right; padding-right: 10px; color: #a8a29e; user-select: none; }
  .src div.base { color: var(--ink-2); }
  .src div.on { color: var(--ink); background: var(--new-soft); border-left-color: var(--new); }
  .src div.on .ln { color: var(--new); }

  /* Hoofdvlak */
  .hero { display: flex; flex-direction: column; padding: 18px 22px; }
  .kicker { display: inline-block; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-tint); padding: 3px 10px; border-radius: 999px; }
  .kicker.re { color: var(--warn); background: var(--warn-tint); }
  .hero h2 { margin: 8px 0 4px; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
  .explain { margin: 0; font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 64ch; min-height: 3.2em; }
  .explain b { color: var(--ink); font-weight: 600; }
  .more { margin: 8px 0 0; font-size: 14px; line-height: 1.6; color: var(--muted); max-width: 72ch; border-left: 3px solid var(--line-2); padding-left: 12px; }
  .more:empty { display: none; }
  .more b { color: var(--ink-2); font-weight: 600; }
  .more code { font: 12.5px var(--mono); background: var(--sunk); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; }
  .explain code, .note code { font: 13px var(--mono); background: var(--sunk); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; }
  .stage { flex: 1; min-height: 290px; margin-top: 16px; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    background-color: var(--sunk); background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 18px 18px; border: 1px solid var(--line); padding: 20px; }
  .stage-inner { animation: fade .35s ease; width: 100%; display: flex; justify-content: center; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  .appear { opacity: 0; animation: pop .35s ease forwards; }
  .empty { color: var(--muted); text-align: center; font-size: 15px; }
  .empty .doc { font: 13px/1.7 var(--mono); color: var(--faint); background: var(--panel); border: 1px dashed var(--line-2); border-radius: 10px; padding: 14px 18px; margin: 0 auto 14px; display: inline-block; text-align: left; }

  .tree { font: 14px/2 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); }
  .tree .node { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tree .tag { color: var(--accent); font-weight: 600; }
  .tree .txt { color: var(--muted); }
  .chip { font: 12px/1.5 var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); color: var(--ink-2); }
  .chg { background: var(--warn-soft) !important; border-color: var(--warn) !important; color: var(--warn) !important; }
  .cssom { margin-top: 12px; font: 12.5px/1.7 var(--mono); color: var(--muted); border-top: 1px dashed var(--line-2); padding-top: 10px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; font-family: var(--sans); line-height: 1.5; }

  .boxes { position: relative; width: 300px; margin: 30px 170px 14px 0; }
  .bx { position: absolute; border: 2px dashed var(--accent); border-radius: 6px; background: rgba(15, 118, 110, .04); }
  .bx.inner { border-color: var(--warn); background: rgba(194, 65, 12, .05); }
  .bx span { position: absolute; font: 600 11px var(--mono); white-space: nowrap; padding: 2px 7px; border-radius: 5px; }
  .bx.outer > span { top: -26px; left: -2px; background: var(--accent); color: #fff; }
  .bx.inner > span { left: calc(100% + 12px); top: 50%; transform: translateY(-50%); background: var(--warn); color: #fff; }
  .bx.chgbox { border-style: solid; }
  .bx > span.chg { outline: 2px solid var(--warn); outline-offset: 1px; }
  .calc { margin: 0 auto; width: max-content; font: 12px/1.9 var(--mono); color: var(--ink-2); text-align: left; }
  .calc div { padding: 0 8px; border-radius: 5px; }
  .calc b { color: var(--ink); }
  .calc .why { color: var(--faint); margin-left: 10px; font-family: var(--sans); }
  .calc .chg { background: var(--warn-soft); color: var(--warn); }

  .dl { font: 13.5px/2.1 var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px; box-shadow: var(--shadow); }
  .dl div { display: flex; gap: 10px; align-items: center; }
  .dl .n { color: var(--faint); width: 16px; text-align: right; }
  .dl .sw { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line-2); flex: none; }

  .raster { display: flex; gap: 40px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  .rlabel { font: 600 11px var(--mono); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; }
  .tilebox { position: relative; display: inline-block; }
  .tiles { position: absolute; inset: -1px; display: grid; }
  .tiles i { background: #e7e5e4; border: 1px dashed rgba(120, 113, 108, .4); animation: reveal .35s ease forwards; }
  @keyframes reveal { to { background: transparent; } }

  .compose { position: relative; width: 708px; height: 196px; zoom: .82; font-family: var(--sans); }
  .sheet { position: absolute; top: 34px; width: 332px; height: var(--sh, 140px); border-radius: 10px; transition: transform 1.1s cubic-bezier(.5, 0, .2, 1); }
  .sheet .checker { position: absolute; inset: 0; border-radius: 10px; background-color: #fff;
    background-image: conic-gradient(#e7e5e4 25%, transparent 0 50%, #e7e5e4 0 75%, transparent 0); background-size: 16px 16px; transition: opacity .6s .9s; }
  .sheet .content { position: absolute; left: 16px; top: 16px; width: 300px; height: var(--ch, 108px); }
  .sheet1 { left: 0; box-shadow: 0 0 0 2px var(--accent); }
  .sheet2 { left: 376px; box-shadow: 0 0 0 2px var(--warn); z-index: 2; }
  .sheet2 .checker { opacity: .6; }
  .plus { position: absolute; left: 332px; width: 44px; top: 34px; height: var(--sh, 140px); display: grid; place-items: center; font: 600 30px var(--sans); color: var(--muted); transition: opacity .4s; }
  .slabel { position: absolute; top: 0; font: 600 13px var(--mono); padding: 3px 9px; border-radius: 6px; color: #fff; transition: opacity .4s; white-space: nowrap; }
  .flabel { position: absolute; top: 0; left: 0; font: 600 13px var(--mono); padding: 3px 9px; border-radius: 6px; color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); opacity: 0; transition: opacity .5s 1s; white-space: nowrap; }
  .compose.flat .plus, .compose.flat .slabel { opacity: 0; }
  .compose.flat .flabel { opacity: 1; }
  .compose.flat .sheet2 { transform: translateX(var(--to)); }
  .compose.flat .checker { opacity: 0; }
  .compose.flat .sheet { box-shadow: none; transition: transform 1.1s cubic-bezier(.5, 0, .2, 1), box-shadow .5s 1s; }
  .scene { perspective: 900px; width: 380px; height: 250px; position: relative; }
  .stack { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(40deg) rotateZ(-14deg) translateY(10px); transition: transform 1.1s cubic-bezier(.5, 0, .2, 1); }
  .stack.flat { transform: none; }
  .ly { position: absolute; left: 40px; top: 70px; width: 300px; height: 108px; transition: transform 1.1s cubic-bezier(.5, 0, .2, 1); }
  .ly1 { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 8px; }
  .ly2 { transform: translateZ(120px); outline: 2px solid var(--warn); outline-offset: 6px; border-radius: 6px; }
  .stack.flat .ly1, .stack.flat .ly2 { outline-color: transparent; }
  .stack.flat .ly2 { transform: translateZ(0); }
  .lytag { position: absolute; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 5px; color: #fff; white-space: nowrap; transition: opacity .6s; }
  .stack.flat .lytag { opacity: 0; }

  .codeline { font: 600 16px var(--mono); color: var(--warn); background: var(--panel); border: 1.5px solid var(--warn); border-radius: 10px; padding: 10px 16px; display: inline-block; box-shadow: var(--shadow); }
  .split { display: flex; gap: 32px; justify-content: center; margin-top: 22px; text-align: left; }
  .split-h { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .split-h.re { color: var(--warn); }
  .tagp { display: inline-block; margin: 0 6px 6px 0; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--panel); border: 1px solid var(--line-2); color: var(--muted); }
  .tagp.re { border-color: var(--warn); color: var(--warn); background: var(--warn-tint); }

  /* Het kaartje */
  .card { box-sizing: border-box; width: 300px; padding: 16px; background: #fff; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.08); text-align: left; position: relative; }
  .card h3 { font: 600 24px/32px var(--sans); margin: 0 0 8px; color: #222; letter-spacing: -.01em; }
  .btn { position: absolute; left: 16px; height: 36px; border-radius: 6px; color: #fff; font: 500 15px/36px var(--sans); text-align: center; }

  /* Scherm als browservenster */
  .browser { border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .chrome { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--sunk); border-bottom: 1px solid var(--line); }
  .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); }
  .chrome i:nth-child(1) { background: #f87171; } .chrome i:nth-child(2) { background: #fbbf24; } .chrome i:nth-child(3) { background: #34d399; }
  .chrome .url { margin-left: 8px; flex: 1; font: 11.5px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
  .screen { height: 150px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #fff; }
  .screen .scale { transform: scale(.78); animation: fadeOnly .4s ease; }
  @keyframes fadeOnly { from { opacity: 0; } to { opacity: 1; } }
  .screen .blank { color: var(--faint); font-size: 13px; text-align: center; }
  .screen .blank b { color: var(--muted); font-weight: 600; }
  .screen .old { position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 600; background: var(--new-soft); color: var(--new); padding: 2px 8px; border-radius: 999px; }

  /* Geheugen */
  .mem { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .mem li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; transition: all .25s; }
  .mem .dot { width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid var(--line-2); flex: none; }
  .mem .nmw { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
  .mem .name { font-weight: 600; font-size: 13.5px; }
  .mem .what { font-size: 11.5px; color: var(--muted); }
  .mem .st { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--new); background: var(--new-soft); padding: 1px 8px; border-radius: 999px; }
  .mem .st.bad { color: var(--warn); background: var(--warn-soft); }
  .mem li.absent { opacity: .6; } .mem li.absent .name { color: var(--muted); }
  .mem li.present .dot { background: var(--accent); border-color: var(--accent); }
  .mem li.new { background: var(--new-soft); border-color: #fde68a; }
  .mem li.new .dot { background: var(--new); border-color: var(--new); }
  .mem li.stale { background: var(--warn-tint); }
  .mem li.stale .name { text-decoration: line-through; color: var(--warn); }
  .mem li.stale .dot { background: #fff; border-color: var(--warn); }

  /* Bediening */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; }
  .bar .spacer { flex: 1; }
  .bar button { font: 600 14px var(--sans); border-radius: 10px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2); transition: all .15s; }
  .bar button:hover:not(:disabled) { background: var(--sunk); border-color: var(--faint); }
  .bar button:disabled { opacity: .5; cursor: not-allowed; }
  .bar .primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 9px 22px; }
  .bar .primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
  .hint { font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0 !important; border-radius: 0 !important; color: var(--warn) !important; }
  .seg button + button { border-left: 1px solid var(--line-2) !important; }
  .seg button:hover:not(:disabled) { background: var(--warn-tint) !important; }
  kbd { font: 11px var(--mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--panel); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div><h1>Browser in slow motion</h1><p>Van HTML en CSS naar pixels, één stap per keer</p></div>
    </div>
    <div class="frame-badge" id="frameBadge"></div>
  </header>

  <nav class="stepper" id="timeline" aria-label="Stappen van de rendering pipeline"></nav>

  <main class="grid">
    <section class="panel">
      <p class="label">Broncode</p>
      <div class="src" id="src"></div>
    </section>

    <section class="panel hero">
      <div>
        <span class="kicker" id="kicker"></span>
        <h2 id="stageLabel"></h2>
        <p class="explain" id="explain"></p>
        <p class="more" id="more"></p>
      </div>
      <div class="stage" id="stage"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <p class="label">Op het scherm</p>
        <div class="browser">
          <div class="chrome"><i></i><i></i><i></i><span class="url">bestelling.html</span></div>
          <div class="screen" id="screen"></div>
        </div>
      </section>
      <section class="panel">
        <p class="label">In het geheugen van de browser</p>
        <ul class="mem" id="mem"></ul>
      </section>
    </aside>
  </main>

  <footer class="bar">
    <button id="prev">← Vorige</button>
    <button class="primary" id="next">Volgende →</button>
    <span class="hint"><kbd>←</kbd> <kbd>→</kbd></span>
    <span class="spacer"></span>
    <span class="hint" id="chgHint"></span>
    <div class="seg">
      <button data-chg="wide">breedte</button>
      <button data-chg="red">kleur</button>
      <button data-chg="moved">transform</button>
      <button data-chg="long">langere titel</button>
    </div>
    <button id="reset">Opnieuw</button>
  </footer>
</div>

<script>
const STEPS = ['parse', 'style', 'layout', 'paint', 'raster', 'composite'];
const NAMES = { parse: 'Parse', style: 'Style', layout: 'Layout', paint: 'Paint', raster: 'Raster', composite: 'Composite' };
const OUT = { parse: ['dom', 'cssom'], style: ['computed'], layout: ['layout'], paint: ['display'], raster: ['layers'], composite: ['frame'] };
const MEM = [
  ['dom', 'DOM', 'elementen als boom'],
  ['cssom', 'CSSOM', 'de CSS-regels'],
  ['computed', 'Computed style', 'waarden per element'],
  ['layout', 'Layout tree', 'posities en maten'],
  ['display', 'Display list', 'tekenopdrachten'],
  ['layers', 'Gerasterde layers', 'pixels per layer, in tegels'],
  ['frame', 'Frame', 'het beeld op het scherm'],
];
const CHANGES = {
  wide:  { label: 'breedte',       what: 'breedte van de knop',   prop: 'width',      off: '96px',  on: '160px',            path: ['style', 'layout', 'paint', 'raster', 'composite'], stale: ['computed', 'layout', 'display', 'layers', 'frame'] },
  red:   { label: 'kleur',         what: 'kleur van de knop',     prop: 'background', off: 'teal',  on: 'tomato',           path: ['style', 'paint', 'raster', 'composite'], stale: ['computed', 'display', 'layers', 'frame'] },
  moved: { label: 'transform',     what: 'transform van de knop', prop: 'transform',  off: 'none',  on: 'translateX(40px)', path: ['style', 'composite'],                    stale: ['computed', 'frame'] },
  // De tekst verandert, niet de CSS: de computed style blijft gelijk, maar de maten niet.
  long:  { label: 'langere titel', what: 'tekst van de titel',    off: 'Bestelling #42', on: 'Bestelling #42 – wacht op betaling', path: ['layout', 'paint', 'raster', 'composite'], stale: ['layout', 'display', 'layers', 'frame'] },
};

const S = {
  flags: { wide: false, red: false, moved: false, long: false },
  oldFlags: null,      // wat er op het scherm staat tijdens een herberekening
  mode: 'initial',     // 'initial' of 'rerun'
  pos: 0,              // initial: 0..5 (aantal afgewerkte stappen); rerun: 0..path.length
  change: null,        // sleutel uit CHANGES
  frameNo: 1,
};

const val = (f, k) => f[k] ? CHANGES[k].on : CHANGES[k].off;
const btnW = f => f.wide ? 160 : 96;
const btnBg = f => f.red ? 'tomato' : 'teal';
const btnTx = f => f.moved ? 40 : 0;
// Geometrie van het kaartje (box-sizing: border-box, dus de padding zit binnen de 300px)
const title = f => val(f, 'long');
const h3H = f => f.long ? 64 : 32;           // 1 of 2 regels van 32px
const btnY = f => 16 + h3H(f) + 8;           // padding + h3 + margin-bottom
const cardH = f => btnY(f) + 36 + 16;        // knop + padding-bottom
const codeFor = (k, f) => k === 'long' ? `h3.textContent = '${title(f)}'` : `button.style.${CHANGES[k].prop} = '${val(f, k)}'`;

function path() { return S.mode === 'initial' ? STEPS : CHANGES[S.change].path; }
function curStep() { return S.pos === 0 ? null : path()[S.pos - 1]; }
function atEnd() { return S.pos === path().length; }

/* ---------- Broncode ---------- */
function renderSrc() {
  const f = S.flags, st = curStep(), chg = S.mode === 'rerun' ? S.change : null;
  const L = [
    ['<article class="card">', ['parse']],
    [`  <h3>${title(f)}</h3>`, ['parse', 'layout', 'paint'], 'long'],
    ['  <button>Details</button>', ['parse', 'paint']],
    ['</article>', ['parse']],
    ['', []],
    ['.card {', ['parse']],
    ['  width: 300px; padding: 16px;', ['parse', 'style', 'layout']],
    ['  box-sizing: border-box;', ['parse', 'style', 'layout']],
    ['  background: white;', ['parse', 'style', 'paint']],
    ['}', ['parse']],
    ['h3 {', ['parse']],
    ['  font-size: 24px; line-height: 32px;', ['parse', 'style', 'layout']],
    ['  margin: 0 0 8px;', ['parse', 'style', 'layout']],
    ['}', ['parse']],
    ['button {', ['parse']],
    [`  width: ${val(f, 'wide')}; height: 36px;`, ['parse', 'style', 'layout'], 'wide'],
    [`  background: ${val(f, 'red')};`, ['parse', 'style', 'paint'], 'red'],
    [`  transform: ${val(f, 'moved')};`, ['parse', 'style', 'composite'], 'moved'],
    ['  will-change: transform;', ['parse', 'style', 'raster', 'composite']],
    ['}', ['parse']],
  ];
  document.getElementById('src').innerHTML = L.map(([t, steps, key], i) => {
    let cls = '';
    if (S.mode === 'initial') cls = st && steps.includes(st) ? 'on' : (S.pos === 0 ? 'base' : '');
    else cls = key === chg ? 'on' : 'base';
    return `<div class="${cls}"><span class="ln">${i + 1}</span>${esc(t) || ' '}</div>`;
  }).join('');
}
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ---------- Stepper ---------- */
const QUESTION = { parse: 'Wat staat er?', style: 'Hoe ziet het eruit?', layout: 'Waar en hoe groot?', paint: 'Wat teken je?', raster: 'Welke pixels?', composite: 'Eén beeld' };
function renderTimeline() {
  const p = path();
  document.getElementById('timeline').innerHTML = STEPS.map((s, idx) => {
    let cls = '', q = QUESTION[s];
    if (S.mode === 'initial') {
      const i = idx + 1;
      cls = i < S.pos ? 'done' : i === S.pos ? 'cur' : '';
    } else {
      const i = p.indexOf(s) + 1;
      if (i === 0) { cls = 'skip'; q = 'overgeslagen'; }
      else cls = 're ' + (i < S.pos ? 'done' : i === S.pos ? 'cur' : '');
    }
    return `<div class="step ${cls}"><span class="num">${cls.includes('done') ? '✓' : idx + 1}</span><span class="txt"><span class="nm">${NAMES[s]}</span><span class="q">${q}</span></span></div>`;
  }).join('');
  document.getElementById('frameBadge').innerHTML = S.mode === 'initial'
    ? `<span class="dot"></span>Frame ${S.frameNo} · eerste render`
    : `<span class="dot re"></span>Frame ${S.frameNo} · wijziging: ${CHANGES[S.change].label}`;
}

/* ---------- Geheugen ---------- */
function renderMem() {
  let present = new Set(), fresh = new Set(), stale = new Set();
  if (S.mode === 'initial') {
    STEPS.slice(0, S.pos).forEach(s => OUT[s].forEach(k => present.add(k)));
    const st = curStep(); if (st) OUT[st].forEach(k => fresh.add(k));
  } else {
    MEM.forEach(([k]) => present.add(k));
    const c = CHANGES[S.change];
    c.stale.forEach(k => stale.add(k));
    c.path.slice(0, S.pos).forEach(s => OUT[s].forEach(k => stale.delete(k)));
    const st = curStep(); if (st) OUT[st].filter(k => c.stale.includes(k)).forEach(k => fresh.add(k));
  }
  document.getElementById('mem').innerHTML = MEM.map(([k, name, what]) => {
    const cls = stale.has(k) ? 'stale' : fresh.has(k) ? 'present new' : present.has(k) ? 'present' : 'absent';
    const tag = cls === 'stale' ? '<span class="st bad">ongeldig</span>' : cls.includes('new') ? '<span class="st">nieuw</span>' : '';
    return `<li class="${cls}"><span class="dot"></span><span class="nmw"><span class="name">${name}</span><span class="what">${what}</span></span>${tag}</li>`;
  }).join('');
}

/* ---------- Het kaartje ---------- */
function cardHTML(f, { noButton = false, onlyButton = false } = {}) {
  const b = `<div class="btn" style="top:${btnY(f)}px;width:${btnW(f)}px;background:${btnBg(f)};transform:translateX(${btnTx(f)}px)">Details</div>`;
  if (onlyButton) return `<div style="position:relative;width:300px;height:${cardH(f)}px">${b}</div>`;
  return `<div class="card" style="height:${cardH(f)}px"><h3>${title(f)}</h3>${noButton ? '' : b}</div>`;
}

/* ---------- Middenvlak per stap ---------- */
function stageFor(step, f, hl) {
  const c = k => hl === k ? ' chg' : '';
  const d = i => `style="animation-delay:${i * 0.12}s"`;
  switch (step) {
    case 'parse': return `
      <div class="tree">
        <div class="node appear" ${d(0)}><span class="tag">article</span><span class="txt">.card</span></div>
        <div class="node appear" ${d(1)} style="padding-left:24px;animation-delay:.12s">└ <span class="tag">h3</span></div>
        <div class="node appear" style="padding-left:56px;animation-delay:.24s"><span class="txt">"${title(f)}"</span></div>
        <div class="node appear" style="padding-left:24px;animation-delay:.36s">└ <span class="tag">button</span></div>
        <div class="node appear" style="padding-left:56px;animation-delay:.48s"><span class="txt">"Details"</span></div>
        <div class="cssom appear" style="animation-delay:.7s">CSSOM: 3 regels (.card, h3, button)</div>
      </div>`;
    case 'style': return `
      <div class="tree">
        <div class="node"><span class="tag">article</span>
          <span class="chip appear" ${d(1)}>width: 300px</span><span class="chip appear" ${d(2)}>padding: 16px</span><span class="chip appear" ${d(3)}>box-sizing: border-box</span><span class="chip appear" ${d(4)}>background: white</span></div>
        <div class="node" style="padding-left:24px">└ <span class="tag">h3</span>
          <span class="chip appear" ${d(4)}>font-size: 24px</span><span class="chip appear" ${d(5)}>line-height: 32px</span><span class="chip appear" ${d(6)}>margin: 0 0 8px</span></div>
        <div class="node" style="padding-left:24px">└ <span class="tag">button</span>
          <span class="chip appear${c('wide')}" ${d(7)}>width: ${val(f, 'wide')}</span><span class="chip appear" ${d(8)}>height: 36px</span><span class="chip appear${c('red')}" ${d(9)}>background: ${val(f, 'red')}</span><span class="chip appear${c('moved')}" ${d(10)}>transform: ${val(f, 'moved')}</span></div>
        <div class="note">Elk element krijgt één definitieve waarde per property: de computed style.</div>
      </div>`;
    case 'layout': {
      const L = hl === 'long', W = hl === 'wide';
      const box = (cls, x, y, w, h, label, changed, delay) =>
        `<div class="bx ${cls} appear${changed ? ' chgbox' : ''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;animation-delay:${delay}s"><span class="${changed ? 'chg' : ''}">${label}</span></div>`;
      const row = (txt, why, changed, i) => `<div class="appear${changed ? ' chg' : ''}" style="animation-delay:${.7 + i * .15}s">${txt}<span class="why">${why}</span></div>`;
      return `
      <div>
        <div class="boxes" style="height:${cardH(f)}px">
          ${box('outer', 0, 0, 300, cardH(f), `article · x0 y0 · 300×${cardH(f)}`, L, 0)}
          ${box('inner', 16, 16, 268, h3H(f), `h3 · x16 y16 · 268×${h3H(f)}`, L, .25)}
          ${box('inner', 16, btnY(f), btnW(f), 36, `button · x16 y${btnY(f)} · ${btnW(f)}×36`, L || W, .5)}
        </div>
        <div class="calc">
          ${row('h3 breedte &nbsp;&nbsp;&nbsp;&nbsp;= 300 − 16 − 16 = <b>268</b>', 'wat de ouder overlaat na padding', false, 0)}
          ${row(`h3 hoogte &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= ${f.long ? '2' : '1'} regel${f.long ? 's' : ''} × 32 = <b>${h3H(f)}</b>`, 'volgt uit de tekst', L, 1)}
          ${row(`knop y &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= 16 + ${h3H(f)} + 8 = <b>${btnY(f)}</b>`, 'padding + h3 + margin', L, 2)}
          ${row(`article hoogte = ${btnY(f)} + 36 + 16 = <b>${cardH(f)}</b>`, 'volgt uit de inhoud', L, 3)}
        </div>
        <div class="note">Nog geen kleur, geen pixels: alleen maten en posities.${f.moved ? ' De transform telt hier niet mee: layout ziet de knop nog op x16.' : ''}</div>
      </div>`;
    }
    case 'paint': {
      const L = hl === 'long' ? ' chg' : '';
      const lines = [
        [`drawRoundRect(0, 0, 300, ${cardH(f)}, r=8)`, '#fff', L],
        ...(f.long
          ? [['drawText("Bestelling #42 – wacht", 16, 40)', '#222', L], ['drawText("op betaling", 16, 72)', '#222', L]]
          : [['drawText("Bestelling #42", 16, 40)', '#222', L]]),
        [`drawRoundRect(16, ${btnY(f)}, ${btnW(f)}, 36, r=6)`, btnBg(f), hl === 'wide' || hl === 'red' || hl === 'long' ? ' chg' : ''],
        ['drawText("Details", …)', '#fff', ''],
      ];
      return `
      <div>
        <div class="dl">${lines.map(([t, col, x], i) =>
          `<div class="appear" ${d(i * 2)}><span class="n">${i + 1}</span><span class="sw" style="background:${col}"></span><span class="chip${x}">${t}</span></div>`).join('')}
        </div>
        <div class="note">Een lijst opdrachten in tekenvolgorde. Kijk naar het scherm: daar staat nog niets.</div>
      </div>`;
    }
    case 'raster': {
      const tiles = (cols, rows, base, animate) => {
        let h = '';
        for (let i = 0; i < cols * rows; i++) h += `<i style="${animate ? `animation-delay:${base + i * 0.18}s` : 'animation:none;background:transparent'}"></i>`;
        return `<div class="tiles" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${h}</div>`;
      };
      // eerste render: alles; knopwijziging: alleen layer 2; langere titel: alleen layer 1 (de knop zelf is niet veranderd)
      const redo1 = !hl || hl === 'long', redo2 = hl !== 'long';
      return `
      <div>
        <div class="raster">
          <div><div class="rlabel" style="color:var(--accent)">layer 1 · kaartje${redo1 ? '' : ' · hergebruikt'}</div>
            <div class="tilebox">${cardHTML(f, { noButton: true })}${tiles(4, f.long ? 3 : 2, 0.1, redo1)}</div></div>
          <div><div class="rlabel" style="color:var(--warn)">layer 2 · knop${redo2 ? '' : ' · hergebruikt'}</div>
            <div class="tilebox"><div class="btn" style="position:relative;left:0;top:0;width:${btnW(f)}px;background:${btnBg(f)}">Details</div>${tiles(2, 1, !hl ? 1.6 : 0.1, redo2)}</div></div>
        </div>
        <div class="note">De opdrachten uit Paint worden pixels, per layer en per tegel. ${hl ? 'Het scherm toont nog het oude frame.' : 'De layers liggen nog los: het scherm is nog leeg.'}</div>
      </div>`;
    }
    case 'composite': return `
      <div style="display:flex;flex-direction:column;align-items:center">
      <div class="compose" id="stack" style="--sh:${cardH(f) + 32}px;--ch:${cardH(f)}px;height:${cardH(f) + 88}px">
        <span class="slabel" style="left:0;background:var(--accent)">layer 1 · kaartje</span>
        <span class="slabel" style="left:376px;background:var(--warn)">layer 2 · knop</span>
        <span class="flabel">frame = layer 1 + layer 2${btnTx(f) ? ', layer 2 40px opgeschoven' : ''}</span>
        <div class="sheet sheet1"><div class="checker"></div><div class="content">${cardHTML(f, { noButton: true })}</div></div>
        <div class="plus">+</div>
        <div class="sheet sheet2" style="--to:${-376 + btnTx(f)}px"><div class="checker"></div>
          <div class="content"><div class="btn" style="top:${btnY(f)}px;width:${btnW(f)}px;background:${btnBg(f)}">Details</div></div></div>
      </div>
      <div class="note">Het geblokte patroon is doorzichtig: waar layer 2 leeg is, zie je layer 1.</div>
      </div>`;
  }
}

function renderStage() {
  const st = curStep(), el = document.getElementById('stage'), lbl = document.getElementById('stageLabel');
  const kick = document.getElementById('kicker');
  kick.textContent = S.mode === 'initial'
    ? (S.pos === 0 ? 'Start' : `Stap ${S.pos} van ${STEPS.length}`)
    : (S.pos === 0 ? 'Wijziging' : `Opnieuw · ${S.pos} van ${path().length}`);
  kick.className = 'kicker' + (S.mode === 'rerun' ? ' re' : '');
  if (S.mode === 'initial' && S.pos === 0) {
    lbl.textContent = 'Alleen tekst';
    el.innerHTML = `<div class="stage-inner"><div class="empty">
      <div class="doc">&lt;article class="card"&gt;&lt;h3&gt;Bestelling #42&lt;/h3&gt;&lt;butt…<br>.card{width:300px;padding:16px;background:wh…</div><br>
      Een stroom tekens, nog zonder betekenis. Druk op <b>Volgende</b>.</div></div>`;
    return;
  }
  if (S.mode === 'rerun' && S.pos === 0) {
    const c = CHANGES[S.change];
    lbl.textContent = `De ${c.what} verandert`;
    el.innerHTML = `<div class="stage-inner"><div style="text-align:center">
      <div class="codeline">${esc(codeFor(S.change, S.flags))}</div>
      <div class="split">
        <div><div class="split-h re">Moet opnieuw</div>${c.path.map(s => `<span class="tagp re">${NAMES[s]}</span>`).join('')}</div>
        <div><div class="split-h">Hergebruikt</div>${STEPS.filter(s => !c.path.includes(s)).map(s => `<span class="tagp">${NAMES[s]}</span>`).join('')}</div>
      </div></div></div>`;
    return;
  }
  lbl.textContent = NAMES[st];
  el.innerHTML = `<div class="stage-inner">${stageFor(st, S.flags, S.mode === 'rerun' ? S.change : null)}</div>`;
  if (st === 'composite') {
    // eerst de losse layers tonen, dan samenklappen tot één beeld
    const at = { mode: S.mode, pos: S.pos, frameNo: S.frameNo };
    setTimeout(() => {
      if (S.mode !== at.mode || S.pos !== at.pos || S.frameNo !== at.frameNo) return; // intussen verder of terug geklikt
      const s = document.getElementById('stack'); if (s) s.classList.add('flat');
      renderScreen(true);
    }, 1500);
  }
}

/* ---------- Scherm ---------- */
function renderScreen(compositeDone = false) {
  const el = document.getElementById('screen');
  const st = curStep();
  if (S.mode === 'initial') {
    if (atEnd() && (compositeDone || st !== 'composite')) {
      el.innerHTML = `<div class="scale">${cardHTML(S.flags)}</div>`;
    } else if (atEnd()) {
      el.innerHTML = `<div class="blank">Layers worden samengevoegd…</div>`;
    } else {
      el.innerHTML = `<div class="blank"><b>Leeg</b><br>Er is nog geen frame.</div>`;
    }
    return;
  }
  if (atEnd() && compositeDone) {
    el.innerHTML = `<div class="scale">${cardHTML(S.flags)}</div>`;
  } else {
    el.innerHTML = `<span class="old">oud frame</span><div class="scale">${cardHTML(S.oldFlags)}</div>`;
  }
}

/* ---------- Uitleg ---------- */
function explain() {
  const st = curStep();
  if (S.mode === 'initial') {
    return [
      'De browser heeft HTML en CSS ontvangen: <b>alleen tekst</b>. Er staat nog niets op het scherm.',
      '<b>Parse</b> leest de tekst en maakt er objecten van: de <b>DOM</b> (de elementen als boom) en de <b>CSSOM</b> (de regels). Dit is de boom die je vanuit JavaScript aanspreekt.',
      '<b>Style</b> zoekt voor elk element welke CSS-regels gelden en rekent de definitieve waarden uit: de <b>computed style</b>.',
      '<b>Layout</b> rekent voor elke box uit waar ze staat en hoe groot ze is. Boxes hangen van elkaar af: de breedte van de h3 komt van de article, de hoogte van de article komt van wat erin staat. Door <code>box-sizing: border-box</code> zit de padding binnen de 300px.',
      '<b>Paint</b> schrijft tekenopdrachten op, in de juiste volgorde. Let op: het scherm is nog <b>leeg</b>. Paint maakt een lijst, geen pixels.',
      '<b>Raster</b> voert de opdrachten uit: elke pixel krijgt een kleur. Dat gebeurt <b>per layer</b> en in <b>tegels</b>, meestal op de GPU. De knop heeft een eigen layer door <code>will-change</code>. Het scherm is nog altijd leeg: de layers liggen nog los.',
      '<b>Composite</b> legt de gerasterde layers op elkaar tot één beeld: het <b>frame</b>. Pas nu staat er iets op het scherm.',
    ][S.pos];
  }
  const c = CHANGES[S.change];
  if (S.pos === 0) return `JavaScript wijzigt de <b>${c.what}</b>. De browser markeert wat <b>ongeldig</b> is. Tot alles opnieuw berekend is, blijft het <b>oude frame</b> op het scherm.`;
  const T = {
    style: 'Style opnieuw: de computed style van de knop verandert. De DOM en de CSSOM worden hergebruikt.',
    layout: S.change === 'long'
      ? 'Layout opnieuw, en nu verschuift er meer: de titel loopt over <b>twee regels</b>, dus de h3 wordt 64 hoog. Daardoor schuift de knop naar y88 en groeit de article naar 140. <b>Eén tekstwijziging, drie boxes met nieuwe maten.</b> Zo ontstaat ook een layout shift.'
      : 'Layout opnieuw: de knop is breder. Er staat niets naast of onder de knop, dus niets anders verschuift. Probeer <b>langere titel</b> om te zien wat er gebeurt als dat wel zo is.',
    paint: S.change === 'long'
      ? 'Paint opnieuw: nieuwe tekst en een hoger kaartje, dus nieuwe tekenopdrachten. De knop heeft dezelfde opdracht, alleen op een andere y.'
      : S.change === 'red'
      ? 'Paint opnieuw, maar <b>layout overgeslagen</b>: een kleur verandert geen maten. Alleen de tekenopdracht van de knop is nieuw.'
      : 'Paint opnieuw: de knop heeft andere maten, dus een nieuwe tekenopdracht.',
    raster: S.change === 'long'
      ? 'Raster opnieuw, maar nu <b>alleen layer 1</b> (het kaartje met de titel). De knop zelf ziet er hetzelfde uit: layer 2 wordt hergebruikt en komt alleen op een andere plek te liggen.'
      : 'Raster opnieuw, maar <b>alleen layer 2</b> (de knop). Layer 1 is niet veranderd en wordt hergebruikt. Dat is het voordeel van een eigen layer.',
    composite: S.change === 'moved'
      ? 'Geen layout, geen paint, geen raster. De compositor <b>schuift layer 2 op</b> en maakt een nieuw frame. Dat kan zelfs terwijl JavaScript bezig is: daarom zijn <code>transform</code>-animaties vlot.'
      : 'De compositor legt de layers opnieuw op elkaar: een nieuw frame.',
  };
  return T[st];
}

/* ---------- Extra uitleg per stap ---------- */
function more() {
  const st = curStep();
  if (S.mode === 'initial') {
    return [
      'Klik door met <b>Volgende</b>. Let bij elke stap op twee panelen: <b>Op het scherm</b> (wat de gebruiker ziet) en <b>In het geheugen</b> (wat de browser intussen heeft opgebouwd).',
      'Parsen gebeurt al terwijl de HTML binnenkomt. Een <code>&lt;script&gt;</code> zonder <code>defer</code> of <code>async</code> pauzeert de parser tot het script gedownload en uitgevoerd is. CSS blokkeert het renderen: zonder CSSOM geen eerste frame.',
      'Hier valt de cascade: specificiteit, volgorde en overerving worden één waarde per property. Dat is wat je in DevTools onder <b>Computed</b> ziet. Kost vooral tijd bij veel elementen en complexe selectors.',
      'Layout is het werk dat het makkelijkst uit de hand loopt: één verandering kan de maten van ouders, kinderen en alles erna wijzigen. Lees je in JavaScript een maat (<code>offsetHeight</code>, <code>getBoundingClientRect()</code>) na een wijziging, dan moet de browser layout <b>meteen</b> doen: forced reflow.',
      'Paint bepaalt ook de <b>volgorde</b>: wat achter wat ligt (z-index, stacking contexts). In DevTools zie je met <b>Rendering → Paint flashing</b> welke delen opnieuw getekend worden.',
      'Waarom aparte layers? Wat in een eigen layer zit, kan veranderen <b>zonder dat de rest opnieuw gerasterd wordt</b>, en verschuiven of vervagen kost zelfs geen raster: de compositor legt de bestaande pixels anders neer. Elementen met <code>will-change: transform</code>, video of 3D-transforms krijgen er een. Maar elke layer is een bitmap in het geheugen: 1000×1000 pixels is al ongeveer 4 MB, op een retinascherm vier keer zoveel. Dus alleen voor wat vaak en vloeiend beweegt. <b>Layers</b> of <b>Layer borders</b> in DevTools toont hoeveel je er hebt.',
      'De compositor draait op een <b>eigen thread</b>. Daarom kan scrollen en een <code>transform</code>-animatie doorlopen terwijl JavaScript de main thread bezet. Voor 60 fps heb je per frame ongeveer <b>16,7 ms</b> voor alles hierboven.',
    ][S.pos];
  }
  if (S.pos === 0) return {
    wide: 'Een maat verandert, dus de wijziging stapt vroeg in: bij Style. Alles erna moet opnieuw.',
    red: 'Een kleur verandert geen maten. Kijk welke stap straks overgeslagen wordt.',
    moved: '<code>transform</code> verschuift alleen de layer. Dit is het goedkoopste pad dat er is.',
    long: 'Hier verandert geen CSS maar de <b>inhoud</b>. Style kan blijven, maar de maten niet: tekst bepaalt mee hoe groot boxes zijn. Denk aan data die binnenkomt, een vertaling of een webfont dat laadt.',
  }[S.change];
  const T = {
    style: 'Alleen het gewijzigde element en wat ervan afhangt wordt herberekend, niet de hele pagina.',
    layout: S.change === 'long'
      ? 'Dit is een <b>layout shift</b>: content onder de titel springt naar beneden. Gebeurt het tijdens het laden, dan telt het mee voor CLS. Oplossing: reserveer ruimte vooraf (vaste hoogte, <code>min-height</code>, skeleton).'
      : 'Op een echte pagina staat er meestal wel iets onder of naast. Een breedte die verandert in een lijst of een tabel laat alles erna opnieuw meten.',
    paint: 'Paint is meestal goedkoper dan layout, maar grote of complexe vlakken (schaduwen, blur, gradients) kosten wel tijd.',
    raster: 'Daarom helpt een eigen layer voor iets dat vaak verandert: de rest van de pagina hoeft niet opnieuw gerasterd te worden. De prijs is geheugen: zet <code>will-change</code> dus niet op alles, liefst alleen vlak voor een animatie.',
    composite: S.change === 'moved'
      ? 'Vuistregel: animeer <code>transform</code> en <code>opacity</code>. <code>top</code>, <code>left</code>, <code>width</code> of <code>height</code> animeren betekent elke frame opnieuw layout en paint.'
      : 'Klaar: een nieuw frame. Probeer een andere wijziging en vergelijk welke stappen opnieuw moeten.',
  };
  return T[st];
}

/* ---------- Alles tekenen ---------- */
function render() {
  renderTimeline(); renderSrc(); renderMem(); renderStage(); renderScreen();
  document.getElementById('explain').innerHTML = explain();
  document.getElementById('more').innerHTML = more();
  document.getElementById('prev').disabled = S.mode === 'initial' && S.pos === 0;
  document.getElementById('next').disabled = atEnd();
  const canChange = atEnd();
  document.querySelectorAll('[data-chg]').forEach(b => {
    b.disabled = !canChange;
    b.textContent = `${CHANGES[b.dataset.chg].label}${S.flags[b.dataset.chg] ? ' terug' : ''}`;
  });
  document.getElementById('chgHint').textContent = canChange ? 'Wijzig het kaartje' : 'Wijzigen kan na de laatste stap';
}

function next() { if (!atEnd()) { S.pos++; render(); } }
function prev() {
  if (S.pos > 0) { S.pos--; render(); return; }
  if (S.mode === 'rerun') {
    // terug naar vóór de wijziging: het vorige frame
    S.flags = { ...S.oldFlags }; S.mode = 'initial'; S.change = null; S.pos = STEPS.length; S.frameNo--; render();
  }
}
function change(key) {
  S.oldFlags = { ...S.flags };
  S.flags = { ...S.flags, [key]: !S.flags[key] };
  S.mode = 'rerun'; S.change = key; S.pos = 0; S.frameNo++;
  render();
}
function reset() { Object.assign(S, { flags: { wide: false, red: false, moved: false, long: false }, oldFlags: null, mode: 'initial', pos: 0, change: null, frameNo: 1 }); render(); }

document.getElementById('next').onclick = next;
document.getElementById('prev').onclick = prev;
document.getElementById('reset').onclick = reset;
document.querySelectorAll('[data-chg]').forEach(b => b.onclick = () => change(b.dataset.chg));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
render();
</script>

</html>
